name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # testcontainers uses the docker daemon that ubuntu runners already have
      - run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the worker reads a fake job board from web/e2e/fakeboard, nothing is fetched from real sites
      - run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
          for i in $(seq 90); do curl -sf localhost:8080/api/health && curl -sf -o /dev/null localhost:8081/ && break; sleep 2; done
      - run: npm ci --no-audit --no-fund && npm run build && npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color | tail -200
