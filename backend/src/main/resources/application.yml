spring:
  application:
    name: fineprint
  datasource:
    url: jdbc:postgresql://localhost:5434/fineprint
    username: fineprint
    password: fineprint

server:
  # hosts like render set PORT
  port: ${PORT:8080}

fineprint:
  cors-origins:
    - http://localhost:5173
    - http://localhost:8081
  jwt:
    # local default only. compose and any real run set FINEPRINT_JWT_SECRET
    secret: "local-dev-secret-change-me-local-dev-secret"
    ttl: 7d
  mail:
    provider: log
    from: "FinePrint <alerts@fineprint.localhost>"
    smtp-host: localhost
    smtp-port: 1025
    resend-base: https://api.resend.com
    resend-api-key: ""
    lease: 2m
    unknown-after: 23h
    sender-threads: 4
    app-url: http://localhost:8081
  sources:
    greenhouse-base: https://boards-api.greenhouse.io/v1/boards/
    lever-base: https://api.lever.co/v0/postings/
  worker:
    enabled: false
    threads: 2
    lease: 5m
    idle-sleep: 500ms
  collector:
    enabled: false
    user-agent: "fineprint-collector/0.1 (student project; low rate)"
    min-gap: 2s
    poll-every: PT1H
    detail-refresh: 24h
    # a posting is closed only after two 404s at least this far apart, while missing from the board list
    close-after: 1h
    # early-career titles only, so the collector stays small
    title-include: "(?i)\\b(new grad(uate)?s?|university grad(uate)?s?|early career|recent grad(uate)?s?|intern(ship)?s?|co-?op|graduate|class of 20\\d\\d)\\b|\\b20(27|28|29)\\b"
    title-exclude: "(?i)\\b(senior|sr|staff|principal|manager|director|lead|head)\\b"
    boards:
      - greenhouse:databricks
      - greenhouse:roblox
      - greenhouse:verkada
      - greenhouse:twitch
      - greenhouse:figma
      - greenhouse:lyft
      - greenhouse:doordashusa
      - greenhouse:cloudflare
      - greenhouse:stripe
      - greenhouse:coinbase
      - lever:palantir
      - lever:zoox
      # held-out companies for the evaluation test split, never used to write the rules
      - greenhouse:waymo
      - greenhouse:pinterest
      - greenhouse:scaleai
      - greenhouse:affirm
      - greenhouse:datadog
      - greenhouse:samsara
      - greenhouse:duolingo
      - greenhouse:nuro
      - greenhouse:mongodb
      - greenhouse:robinhood
      - greenhouse:brex
      - lever:matchgroup
      - lever:veeva
