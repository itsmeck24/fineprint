spring:
  application:
    name: fineprint
  main:
    keep-alive: true
  datasource:
    url: jdbc:postgresql://localhost:5434/fineprint
    username: fineprint
    password: fineprint

fineprint:
  collector:
    enabled: true
    user-agent: "fineprint-collector/0.1 (student project; low rate)"
    min-gap: 2s
    poll-every: PT1H
    detail-refresh: 24h
    # early-career titles only, so the collector stays small
    title-include: "(?i)\\b(new grad(uate)?s?|university grad(uate)?s?|early career|recent grad(uate)?s?|intern(ship)?s?|co-?op|graduate|class of 20\\d\\d)\\b|\\b20(27|28|29)\\b"
    title-exclude: "(?i)\\b(senior|sr|staff|principal|manager|director|lead|head)\\b"
    boards:
      - greenhouse:databricks
      - greenhouse:roblox
      - greenhouse:verkada
      - greenhouse:twitch
      - greenhouse:figma
      - greenhouse:lyft
      - greenhouse:doordashusa
      - greenhouse:cloudflare
      - greenhouse:stripe
      - greenhouse:coinbase
      - lever:palantir
      - lever:zoox
