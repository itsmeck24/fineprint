services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fineprint
      POSTGRES_USER: fineprint
      POSTGRES_PASSWORD: fineprint
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fineprint -d fineprint"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fineprint
      SPRING_DATASOURCE_USERNAME: fineprint
      SPRING_DATASOURCE_PASSWORD: fineprint
    restart: unless-stopped

volumes:
  pgdata:
