x-app-env: &app-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fineprint
  SPRING_DATASOURCE_USERNAME: fineprint
  SPRING_DATASOURCE_PASSWORD: fineprint
  FINEPRINT_JWT_SECRET: ${FINEPRINT_JWT_SECRET:-local-compose-secret-change-me-0123456789}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fineprint
      POSTGRES_USER: fineprint
      POSTGRES_PASSWORD: fineprint
    ports:
      - "127.0.0.1:${FINEPRINT_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fineprint -d fineprint"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${FINEPRINT_API_PORT:-8080}:8080"
    restart: unless-stopped

  # the worker runs the queue and the hourly poll, with no web server
  worker:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      FINEPRINT_WORKER_ENABLED: "true"
      FINEPRINT_COLLECTOR_ENABLED: "true"
      FINEPRINT_MAIL_PROVIDER: smtp
      FINEPRINT_MAIL_SMTP_HOST: mailpit
      FINEPRINT_MAIL_SMTP_PORT: "1025"
    restart: unless-stopped

  # the react app, served by nginx, with /api passed to the api service
  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "127.0.0.1:${FINEPRINT_WEB_PORT:-8081}:80"
    restart: unless-stopped

  # local inbox for alert emails, nothing leaves the machine. web ui on localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${FINEPRINT_MAIL_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  pgdata:
